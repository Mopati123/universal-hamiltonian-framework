name: Truth Pass Branch Validation

on:
  push:
    branches:
      - fix/book-of-mopati-truth-consistency-pass-v2

concurrency:
  group: truth-pass-branch-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate current truth-pass branch head
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyyaml

      - name: Changed-file quality ratchet
        run: python scripts/check_changed_python_quality.py --base origin/main

      - name: Validate workflow YAML
        run: python scripts/validate_github_workflows.py

      - name: Run full tests
        run: pytest tests/ -q

      - name: Certify Book of Mopati
        run: python tools/validate_book_truth.py --certify
